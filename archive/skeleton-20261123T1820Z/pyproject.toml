[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-radar"
version = "1.0.0"
description = "AI Research Agent V1.0 - Cloud-hosted autonomous AI research monitoring"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.5.0",
    "psycopg2-binary>=2.9.0",
    "google-api-python-client>=2.80.0",
    "google-auth>=2.23.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "structlog>=23.2.0",
]

[tool.pytest]
addopts = "-v"
testpaths = [
    "tests",
]