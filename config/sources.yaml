    url: https://api.github.com/repos/openai/openai-agents-python/releases?per_page=20
    max_items: 20
    notes: Official Agents SDK releases.
  # --------------------------------------------------------- Image & video AI
  - id: replicate_blog
    name: Replicate Blog
    category: image_video_ai
    tier: A
    method: rss
    url: https://replicate.com/blog/rss
    max_items: 25
    notes: Official model-hosting announcements covering image/video launches.

  - id: fal_blog
    name: fal.ai Blog
    category: image_video_ai
    tier: A
    method: rss
    url: https://blog.fal.ai/rss/
    max_items: 25
    notes: Official fal.ai generative-media announcements.

  - id: comfyui_releases
    name: ComfyUI Releases
    category: image_video_ai
    tier: A
    method: github_releases
    url: https://api.github.com/repos/comfyanonymous/ComfyUI/releases?per_page=20
    max_items: 20
    notes: Official releases of the dominant local image/video workflow tool.

  - id: hf_image_models
    name: Hugging Face - new text-to-image models
    category: image_video_ai
    tier: A
    method: huggingface_models
    url: https://huggingface.co/api/models?sort=createdAt&direction=-1&limit=30&filter=text-to-image
    max_items: 25
    min_likes: 3
    min_downloads: 200
    notes: >
      Hub API listing, newest first. Uncurated repositories are dominated by
      throwaway uploads (a bare `Testtyu`-style repo scores zero substance), so
      this source requires min_likes=3 and min_downloads=200 before an entry is
      even considered. Trade-off: a brand-new model that has not yet accumulated
      usage is missed; docs/sources.md records how to relax this.

