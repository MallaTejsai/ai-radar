name: research

# Hourly research pass, 08:00-22:00 IST (UTC+05:30) => 02:30-16:30 UTC at :30.
# GitHub cron is best-effort; the pipeline detects and recovers missed slots itself.
on:
  schedule:
    - cron: "30 2-16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without sending Telegram messages (default: safe)"
        type: boolean
        # Safe by default: an accidental manual dispatch must not notify anyone.
        # Set this to false deliberately to send real alerts.
        default: true

# Never cancel a run in progress: an interrupted run leaves the advisory lock and
# a half-finished delivery queue. Overlap is prevented by the database lock instead.
concurrency:
  group: ai-radar-research
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  research:
    # DEPLOYMENT GATE. Scheduled runs are skipped until the owner explicitly sets
    # the repository variable SCHEDULES_ENABLED=true. Pushing this repository
    # therefore cannot start the hourly cadence by itself. Manual dispatch always
    # runs (and defaults to dry_run=true).
    if: ${{ github.event_name != 'schedule' || vars.SCHEDULES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Repo-root execution: `python -m ai_radar` resolves the package here.
      PYTHONPATH: src
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Preferred provider. Without this line free.ai is never constructed and the
      # router silently starts at Gemini, so the primary provider must be wired in
      # explicitly. FREEAI_MODEL is optional (the adapter defaults to qwen7b).
      FREEAI_API_KEY: ${{ secrets.FREEAI_API_KEY }}
      FREEAI_MODEL: ${{ vars.FREEAI_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # Sarvam is a PAID provider. Without this line the adapter is never
      # constructed in the cloud and the router silently degrades to
      # deterministic analysis. The per-run cap and rolling token budget keep
      # their safe defaults (1 call, 5,000 tokens) and are enforced in code.
      # The model pin is optional; an empty value falls back to sarvam-105b.
      SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
      SARVAM_MODEL: ${{ vars.SARVAM_MODEL }}
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
      # Read-only GitHub API access (60 req/h anonymous -> 5000/h authenticated).
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AI_RADAR_LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      # Blocking on the checks a run cannot survive: database reachability and
      # pending migrations. A broken configuration must stop the run instead of
      # producing a "successful" deterministic-only cycle.
      - name: Verify database configuration (blocking)
        run: python -m ai_radar doctor --database-only

      # Advisory: provider/Telegram/Drive reachability. A missing optional key is
      # WARN, not a reason to skip the run.
      - name: Verify integrations (advisory)
        run: python -m ai_radar doctor
        continue-on-error: true

      - name: Run research pipeline
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m ai_radar research --trigger manual --dry-run
          else
            python -m ai_radar research --trigger "${{ github.event_name }}"
          fi

      - name: Report run summary
        if: always()
        run: |
          echo "### AI Radar research run" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Event: \`${{ github.event_name }}\` · commit \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

      # Visible failure signal. The URL is a credential (anyone holding it can
      # send /fail and /success), so it is never echoed - only used.
      - name: Signal failure to the external monitor
        if: failure()
        continue-on-error: true
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: |
          if [ -n "${HEALTHCHECKS_PING_URL}" ]; then
            curl -fsS --max-time 10 --retry 2 "${HEALTHCHECKS_PING_URL%/}/fail" > /dev/null || true
          fi
