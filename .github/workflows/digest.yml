name: digest

# 22:35 IST = 17:05 UTC. Deliberately 35 minutes after the final research run
# (22:00 IST) so the digest always covers a completed day. A 22:00 IST digest
# would race the last research pass - see config/settings.yaml.
on:
  schedule:
    - cron: "5 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render the digest without sending it (default: safe)"
        type: boolean
        # Safe by default: a manual dispatch must not notify anyone by accident.
        default: true

concurrency:
  group: ai-radar-digest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  digest:
    # DEPLOYMENT GATE - see research.yml. Requires vars.SCHEDULES_ENABLED=true.
    if: ${{ github.event_name != 'schedule' || vars.SCHEDULES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Repo-root execution: `python -m ai_radar` resolves the package here.
      PYTHONPATH: src
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      AI_RADAR_LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
      - name: Build and send digest
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m ai_radar digest --dry-run
          else
            python -m ai_radar digest
          fi

      # Visible failure signal; the ping URL is never echoed.
      - name: Signal failure to the external monitor
        if: failure()
        continue-on-error: true
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: |
          if [ -n "${HEALTHCHECKS_PING_URL}" ]; then
            curl -fsS --max-time 10 --retry 2 "${HEALTHCHECKS_PING_URL%/}/fail" > /dev/null || true
          fi
