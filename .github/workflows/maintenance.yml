name: maintenance

# Daily 06:45 IST = 01:15 UTC, before the research window opens.
on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

concurrency:
  group: ai-radar-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  maintenance:
    # DEPLOYMENT GATE - see research.yml. Requires vars.SCHEDULES_ENABLED=true.
    if: ${{ github.event_name != 'schedule' || vars.SCHEDULES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Repo-root execution: `python -m ai_radar` resolves the package here.
      PYTHONPATH: src
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
      AI_RADAR_LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
      - name: Health check
        run: python -m ai_radar maintenance

      # The maintenance job owns the heartbeat, so a failure here must be visible.
      # The ping URL is never echoed.
      - name: Signal failure to the external monitor
        if: failure()
        continue-on-error: true
        env:
          HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: |
          if [ -n "${HEALTHCHECKS_PING_URL}" ]; then
            curl -fsS --max-time 10 --retry 2 "${HEALTHCHECKS_PING_URL%/}/fail" > /dev/null || true
          fi
